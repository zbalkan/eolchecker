[project]
name = "eolchecker"
description = "A local command-line cache and query tool for software and hardware lifecycle data."
readme = "README.md"
version = "0.2.0"
requires-python = ">=3.10"
license = { file = "LICENSE.md" }
keywords = ["eol", "lifecycle", "inventory"]
authors = [{ name = "Zafer Balkan", email = "zafer@zaferbalkan.com" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Topic :: System :: Systems Administration",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "beautifulsoup4>=4.11,<5",
    "requests>=2.28,<3",
]

[project.optional-dependencies]
dev = [
    "bandit>=1.7",
    "build>=1.2",
    "mypy>=1.10",
    "pip-audit>=2.7",
    "pytest>=8.0",
    "ruff>=0.6",
    "twine>=5.0",
]

[project.urls]
Homepage = "https://github.com/zbalkan/eolchecker"

[project.scripts]
eolchecker = "eolchecker.eolchecker:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
warn_unreachable = true
disallow_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
strict_equality = true
no_site_packages = true
files = ["eolchecker", "tests"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
